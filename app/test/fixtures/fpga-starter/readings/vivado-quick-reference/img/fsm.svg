<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="fsm-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker>
  </defs>
  <rect width="640" height="330" rx="14" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#12305a">Moore FSM: detect the sequence 1 0 1</text>
  <!-- step 1: states -->
  <g data-step="1" font-size="15" font-weight="700" text-anchor="middle">
    <line x1="20" y1="170" x2="62" y2="170" stroke="#34495e" stroke-width="2" marker-end="url(#fsm-arr)"/>
    <text x="34" y="160" font-size="11" font-weight="400" fill="#34495e">reset</text>
    <circle cx="100" cy="170" r="36" fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5"/><text x="100" y="167" fill="#1f4e79">S0</text><text x="100" y="185" font-size="11" font-weight="400" fill="#5e6b80">idle</text>
    <circle cx="250" cy="170" r="36" fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5"/><text x="250" y="167" fill="#1f4e79">S1</text><text x="250" y="185" font-size="11" font-weight="400" fill="#5e6b80">got 1</text>
    <circle cx="400" cy="170" r="36" fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5"/><text x="400" y="167" fill="#1f4e79">S2</text><text x="400" y="185" font-size="11" font-weight="400" fill="#5e6b80">got 10</text>
    <circle cx="550" cy="170" r="36" fill="#e3f6ea" stroke="#1a9b5c" stroke-width="2.5"/><circle cx="550" cy="170" r="30" fill="none" stroke="#1a9b5c" stroke-width="1.5"/><text x="550" y="167" fill="#1a9b5c">S3</text><text x="550" y="185" font-size="11" font-weight="400" fill="#1a9b5c">out = 1</text>
  </g>
  <g stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#fsm-arr)">
    <path data-step="2" d="M136 170H212"/>
    <path data-step="3" d="M286 170H362"/>
    <path data-step="4" d="M436 170H512"/>
    <g data-step="5">
      <path d="M85 136c-20-50 50-50 30 0"/>
      <path d="M235 136c-20-50 50-50 30 0"/>
      <path d="M380 200C330 280 160 280 116 203"/>
      <path d="M528 199C480 300 300 300 266 204"/>
      <path d="M530 140C500 90 440 90 420 138"/>
    </g>
  </g>
  <g font-size="15" font-weight="700" fill="#1f6feb" text-anchor="middle">
    <text data-step="2" x="174" y="160">1</text>
    <text data-step="3" x="324" y="160">0</text>
    <text data-step="4" x="474" y="160">1</text>
    <g data-step="5">
      <text x="100" y="100">0</text><text x="250" y="100">1</text>
      <text x="250" y="262">0</text><text x="400" y="292">1</text><text x="475" y="96">0</text>
    </g>
  </g>
</svg>
