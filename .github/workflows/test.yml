name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Keep built learning packages out of this repository
        shell: bash
        run: |
          if git ls-files -- ':(top,glob)**/*.stlp' | grep -q .; then
            echo '::error::Keep course packages in semitec-academy-materials. Tests must build temporary fixtures.'
            exit 1
          fi
      - run: npm ci
      - run: npm run test:unit
      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb && xvfb-run -a npm run test:e2e
