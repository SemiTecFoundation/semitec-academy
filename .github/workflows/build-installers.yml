# Build the SemiTec Academy installers on real Windows, macOS and Linux machines and
# publish them as a GitHub release.
#
# Use:  raise the version in app/package.json and push to main: if no tag v<version> exists yet,
#       the installers are built and tested on every system, then the release v<version> is
#       published with its tag (created by this workflow).
#   or  push a tag  v<version>  that matches app/package.json (e.g. v2.2.1), or
#       Actions -> Build installers -> Run workflow
#       (a manual run builds and uploads artifacts but publishes no release).
#
# Signing (optional, see docs/RELEASING.md): add the repository secrets
#   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD          Windows code-signing certificate (.pfx, base64) + password
#   CSC_LINK / CSC_KEY_PASSWORD                  Apple "Developer ID Application" certificate (.p12, base64) + password
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID   for notarisation
name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['app/package.json']
permissions:
  contents: read          # the release job raises this to write for itself
env:
  APP_DIR: app
jobs:
  # Which version is this, and should it be released? A push to main releases a version
  # only when no tag for it exists yet; a tag push always does; a manual run never does.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./app/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
              echo "v$version already released: nothing to publish"; echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "new version v$version: build and release"; echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    # a push to main that does not bring a new version builds nothing
    if: github.event_name != 'push' || needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, script: dist:win }
          - { os: macos-latest,   script: dist:mac }
          - { os: ubuntu-latest,  script: dist:linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: '${{ env.APP_DIR }}/package-lock.json' }
      - name: Tag must match app/package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag  package.json=$pkg"
          [ "$tag" = "$pkg" ] || {
            echo "::error::tag v$tag does not match app/package.json ($pkg) — the release would name files that were never built"
            exit 1
          }
        working-directory: ${{ env.APP_DIR }}
      - run: npm ci
        working-directory: ${{ env.APP_DIR }}
      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb && xvfb-run -a npm test
        working-directory: ${{ env.APP_DIR }}
      # Only the signing secrets that actually have a value may reach electron-builder:
      # it accepts an EMPTY CSC_LINK as a real certificate path, resolves it against the
      # project directory and dies with "<projectDir> not a file". An unset secret is an
      # empty string, so forwarding them unconditionally breaks every unsigned build.
      - name: Forward the signing secrets that are set
        shell: bash
        env:
          IN_CSC_LINK: ${{ secrets.CSC_LINK }}
          IN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          IN_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          IN_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          IN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD \
                      APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            ref="IN_$name"; value="${!ref:-}"
            if [ -n "$value" ]; then
              printf '%s<<__SECRET_EOF__\n%s\n__SECRET_EOF__\n' "$name" "$value" >> "$GITHUB_ENV"
              echo "forwarding $name"
            fi
          done
          if [ "$RUNNER_OS" = macOS ] && [ -z "${IN_CSC_LINK:-}" ]; then
            echo "note: no Apple certificate - the app is signed ad-hoc (identity \"-\")"
          fi

      - run: npm run ${{ matrix.script }}
        working-directory: ${{ env.APP_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            installers/*/*.exe
            installers/*/*.dmg
            installers/*/*.AppImage
            installers/*/*.deb

  release:
    # A version tag, or a new version pushed to main; needs every platform to have built.
    if: needs.prepare.outputs.release == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Render the release notes for this version
        run: |
          # every release carries the install instructions, above the generated changelog
          sed "s/{{VERSION}}/${{ needs.prepare.outputs.version }}/g" .github/release-notes.md > notes.md
          grep -q '{{VERSION}}' notes.md && { echo "placeholder left unreplaced"; exit 1; } || true
          head -5 notes.md
      - name: Collect installers and checksums
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name '*.exe' -o -name '*.dmg' \
               -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp -n {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -lh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}   # created on this commit when it does not exist yet
          target_commitish: ${{ github.sha }}
          name: v${{ needs.prepare.outputs.version }}
          files: release/*
          body_path: notes.md          # install instructions …
          generate_release_notes: true  # … then the generated changelog underneath
          fail_on_unmatched_files: true
