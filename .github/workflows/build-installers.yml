# Build the SemiTec Academy installers on real Windows, macOS and Linux machines and
# publish them as a GitHub release.
#
# Use:  push a tag  v<version>  (e.g. v1.6.0), or Actions -> Build installers -> Run workflow
#       (a manual run builds and uploads artifacts but publishes no release).
#
# Signing (optional, see docs/RELEASING.md): add the repository secrets
#   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD          Windows code-signing certificate (.pfx, base64) + password
#   CSC_LINK / CSC_KEY_PASSWORD                  Apple "Developer ID Application" certificate (.p12, base64) + password
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID   for notarisation
name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ['v*', 'academy-v*']
env:
  APP_DIR: app
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, script: dist:win }
          - { os: macos-latest,   script: dist:mac }
          - { os: ubuntu-latest,  script: dist:linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: '${{ env.APP_DIR }}/package-lock.json' }
      - run: npm ci
        working-directory: ${{ env.APP_DIR }}
      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb && xvfb-run -a npm test
        working-directory: ${{ env.APP_DIR }}
      - run: npm run ${{ matrix.script }}
        working-directory: ${{ env.APP_DIR }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            installers/*/*.exe
            installers/*/*.dmg
            installers/*/*.zip
            installers/*/*.AppImage
            installers/*/*.deb

  release:
    # Only for a version tag; needs every platform to have built.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Collect installers and checksums
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
               -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp -n {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -lh
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
