# Build the SemiTec Academy installers on real Windows, macOS and Linux machines and
# publish them as a GitHub release.
#
# Use:  push a tag  v<version>  (e.g. v1.6.0), or Actions -> Build installers -> Run workflow
#       (a manual run builds and uploads artifacts but publishes no release).
#
# Signing (optional, see docs/RELEASING.md): add the repository secrets
#   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD          Windows code-signing certificate (.pfx, base64) + password
#   CSC_LINK / CSC_KEY_PASSWORD                  Apple "Developer ID Application" certificate (.p12, base64) + password
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID   for notarisation
name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ['v*', 'academy-v*']
env:
  APP_DIR: app
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, script: dist:win }
          - { os: macos-latest,   script: dist:mac }
          - { os: ubuntu-latest,  script: dist:linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: '${{ env.APP_DIR }}/package-lock.json' }
      - run: npm ci
        working-directory: ${{ env.APP_DIR }}
      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb && xvfb-run -a npm test
        working-directory: ${{ env.APP_DIR }}
      # Only the signing secrets that actually have a value may reach electron-builder:
      # it accepts an EMPTY CSC_LINK as a real certificate path, resolves it against the
      # project directory and dies with "<projectDir> not a file". An unset secret is an
      # empty string, so forwarding them unconditionally breaks every unsigned build.
      - name: Forward the signing secrets that are set
        shell: bash
        env:
          IN_CSC_LINK: ${{ secrets.CSC_LINK }}
          IN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          IN_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          IN_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          IN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD \
                      APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            ref="IN_$name"; value="${!ref:-}"
            if [ -n "$value" ]; then
              printf '%s<<__SECRET_EOF__\n%s\n__SECRET_EOF__\n' "$name" "$value" >> "$GITHUB_ENV"
              echo "forwarding $name"
            fi
          done
          if [ "$RUNNER_OS" = macOS ] && [ -z "${IN_CSC_LINK:-}" ]; then
            echo "note: no Apple certificate - the app is signed ad-hoc (identity \"-\")"
          fi

      - run: npm run ${{ matrix.script }}
        working-directory: ${{ env.APP_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            installers/*/*.exe
            installers/*/*.dmg
            installers/*/*.AppImage
            installers/*/*.deb

  release:
    # Only for a version tag; needs every platform to have built.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Render the release notes for this version
        run: |
          # every release carries the install instructions, above the generated changelog
          sed "s/{{VERSION}}/${GITHUB_REF_NAME#v}/g" .github/release-notes.md > notes.md
          grep -q '{{VERSION}}' notes.md && { echo "placeholder left unreplaced"; exit 1; } || true
          head -5 notes.md
      - name: Collect installers and checksums
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name '*.exe' -o -name '*.dmg' \
               -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp -n {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -lh
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: notes.md          # install instructions …
          generate_release_notes: true  # … then the generated changelog underneath
          fail_on_unmatched_files: true
