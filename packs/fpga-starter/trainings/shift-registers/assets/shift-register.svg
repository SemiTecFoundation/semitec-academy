<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="sr-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker>
  </defs>
  <rect width="640" height="300" rx="14" fill="#ffffff"/>
  <!-- static structure -->
  <g stroke="#34495e" stroke-width="2" fill="none">
    <line x1="30" y1="125" x2="118" y2="125" marker-end="url(#sr-arr)"/>
    <line x1="200" y1="125" x2="238" y2="125" marker-end="url(#sr-arr)"/>
    <line x1="320" y1="125" x2="358" y2="125" marker-end="url(#sr-arr)"/>
    <line x1="440" y1="125" x2="478" y2="125" marker-end="url(#sr-arr)"/>
    <line x1="560" y1="125" x2="610" y2="125" marker-end="url(#sr-arr)"/>
    <polyline points="30,225 520,225"/>
    <line x1="160" y1="225" x2="160" y2="172"/><line x1="280" y1="225" x2="280" y2="172"/>
    <line x1="400" y1="225" x2="400" y2="172"/><line x1="520" y1="225" x2="520" y2="172"/>
  </g>
  <g fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5">
    <rect x="120" y="80" width="80" height="90" rx="8"/><rect x="240" y="80" width="80" height="90" rx="8"/>
    <rect x="360" y="80" width="80" height="90" rx="8"/><rect x="480" y="80" width="80" height="90" rx="8"/>
  </g>
  <g fill="#1f4e79" font-size="13" font-weight="700" text-anchor="middle">
    <text x="160" y="98">FF0</text><text x="280" y="98">FF1</text><text x="400" y="98">FF2</text><text x="520" y="98">FF3</text>
  </g>
  <g fill="#34495e" font-size="13">
    <text x="30" y="115">D_in</text><text x="30" y="245">clk</text><text x="575" y="115">D_out</text>
  </g>
  <g fill="#34495e"><path d="M152 172l8-10 8 10z"/><path d="M272 172l8-10 8 10z"/><path d="M392 172l8-10 8 10z"/><path d="M512 172l8-10 8 10z"/></g>

  <!-- step 1: empty register -->
  <g data-step="1" data-until="1" font-size="22" font-weight="700" text-anchor="middle" fill="#7f8c8d">
    <text x="160" y="140">0</text><text x="280" y="140">0</text><text x="400" y="140">0</text><text x="520" y="140">0</text>
    <text x="320" y="285" font-size="15" font-weight="400" fill="#34495e">After reset every flip-flop holds 0.</text>
  </g>
  <!-- step 2: first clock edge, bit 1 enters -->
  <g data-step="2" data-until="2" font-size="22" font-weight="700" text-anchor="middle">
    <circle cx="160" cy="133" r="20" fill="#1f6feb"/><text x="160" y="141" fill="#fff">1</text>
    <text x="280" y="141" fill="#7f8c8d">0</text><text x="400" y="141" fill="#7f8c8d">0</text><text x="520" y="141" fill="#7f8c8d">0</text>
    <text x="70" y="160" font-size="16" fill="#1f6feb">1 →</text>
    <path d="M60 255v-18h20v18h20" stroke="#d9932b" stroke-width="3" fill="none"/>
    <text x="320" y="285" font-size="15" font-weight="400" fill="#34495e">Edge 1: D_in = 1 is captured by FF0.</text>
  </g>
  <!-- step 3: second edge, everything shifts right -->
  <g data-step="3" data-until="3" font-size="22" font-weight="700" text-anchor="middle">
    <text x="160" y="141" fill="#7f8c8d">0</text>
    <circle cx="280" cy="133" r="20" fill="#1f6feb"/><text x="280" y="141" fill="#fff">1</text>
    <text x="400" y="141" fill="#7f8c8d">0</text><text x="520" y="141" fill="#7f8c8d">0</text>
    <text x="70" y="160" font-size="16" fill="#1f6feb">0 →</text>
    <path d="M216 108q24-26 48 0" stroke="#1f6feb" stroke-width="2" fill="none" stroke-dasharray="4 3"/>
    <text x="320" y="285" font-size="15" font-weight="400" fill="#34495e">Edge 2: the 1 moves to FF1, a new 0 enters FF0.</text>
  </g>
  <!-- step 4: after four edges, parallel read -->
  <g data-step="4" font-size="22" font-weight="700" text-anchor="middle">
    <circle cx="160" cy="133" r="20" fill="#1f6feb"/><text x="160" y="141" fill="#fff">1</text>
    <circle cx="280" cy="133" r="20" fill="#1f6feb"/><text x="280" y="141" fill="#fff">1</text>
    <text x="400" y="141" fill="#7f8c8d">0</text>
    <circle cx="520" cy="133" r="20" fill="#1f6feb"/><text x="520" y="141" fill="#fff">1</text>
    <g stroke="#1a9b5c" stroke-width="2"><line x1="160" y1="80" x2="160" y2="45"/><line x1="280" y1="80" x2="280" y2="45"/><line x1="400" y1="80" x2="400" y2="45"/><line x1="520" y1="80" x2="520" y2="45"/></g>
    <text x="340" y="34" font-size="16" fill="#1a9b5c">parallel out: Q3..Q0 = 1 0 1 1</text>
    <text x="320" y="285" font-size="15" font-weight="400" fill="#34495e">After 4 edges the serial stream 1,0,1,1 is stored and read in parallel.</text>
  </g>
</svg>
