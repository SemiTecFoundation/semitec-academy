# GitHub Actions: build SemiTec Academy installers on real Windows, macOS and Linux machines.
# Use: copy to <repo>/.github/workflows/build-installers.yml (adjust APP_DIR if the repo root differs),
# push a tag like  academy-v1.3.0  (or run it by hand: Actions → Build installers → Run workflow).
# Signing (optional, see docs/RELEASING.md): add the repository secrets
#   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD          Windows code-signing certificate (.pfx, base64) + password
#   CSC_LINK / CSC_KEY_PASSWORD                  Apple "Developer ID Application" certificate (.p12, base64) + password
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID   for notarisation
name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ['academy-v*']
env:
  APP_DIR: Products/Academy/app
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, script: dist:win }
          - { os: macos-latest,   script: dist:mac }
          - { os: ubuntu-latest,  script: dist:linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: '${{ env.APP_DIR }}/package-lock.json' }
      - run: npm ci
        working-directory: ${{ env.APP_DIR }}
      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb && xvfb-run -a npm test
        working-directory: ${{ env.APP_DIR }}
      - run: npm run ${{ matrix.script }}
        working-directory: ${{ env.APP_DIR }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            Products/Academy/installers/*/*.exe
            Products/Academy/installers/*/*.dmg
            Products/Academy/installers/*/*.zip
            Products/Academy/installers/*/*.AppImage
            Products/Academy/installers/*/*.deb
